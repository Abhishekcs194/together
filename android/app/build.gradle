plugins {
    id 'com.android.application'
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def togetherHost = project.findProperty('togetherHost') ?: 'together-i1b2.onrender.com'

android {
    namespace 'io.github.abhishekcs194.together'
    compileSdk 36

    defaultConfig {
        applicationId "io.github.abhishekcs194.together"
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName "1.0.1"

        // Everything that names the site comes from gradle.properties → togetherHost.
        manifestPlaceholders = [togetherHost: togetherHost]
        resValue 'string', 'launch_url', "https://${togetherHost}/"
        resValue 'string', 'asset_statements',
            "[{\\\"relation\\\": [\\\"delegate_permission/common.handle_all_urls\\\"], \\\"target\\\": {\\\"namespace\\\": \\\"web\\\", \\\"site\\\": \\\"https://${togetherHost}\\\"}}]"
        resValue 'string', 'share_target',
            "{\\\"action\\\": \\\"https://${togetherHost}/share\\\", \\\"method\\\": \\\"GET\\\", \\\"params\\\": {\\\"title\\\": \\\"title\\\", \\\"text\\\": \\\"text\\\", \\\"url\\\": \\\"url\\\"}}"
    }

    signingConfigs {
        release {
            if (keystoreProperties.containsKey('storeFile')) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
}
